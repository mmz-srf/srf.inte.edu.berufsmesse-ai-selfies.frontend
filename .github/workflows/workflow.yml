name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install
      - run: npm run build

      - name: SonarQube Scan
        run: npm run sonar
        env:
          SONAR_TOKEN: ${{ secrets.EDU_SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io